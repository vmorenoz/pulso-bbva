name: Package Pulso v4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulso-v4-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: v4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v4/package-lock.json

      - name: Install locked build dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare clean outputs
        id: metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const {version} = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(version)) throw new Error('Invalid package version');
          for (const directory of ['dist', 'artifacts']) fs.rmSync(directory, {recursive: true, force: true});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PULSO_INSTALLER_ARCHIVE=${path.resolve('artifacts', `pulso-opencode-installer-${version}.tar.gz`)}\n`);
          NODE

      # Each package script builds and checks its runtime before archiving it.
      - name: Build and package both runtimes and standalone installer
        run: |
          npm run package:opencode
          npm run package:vscode
          node scripts/package-installer.mjs

      - name: Verify runtime archives and checksums
        run: npm run verify:packages

      # Exercise the core and both adapters, not only packaging. Installer tests
      # use disposable fixture homes and this run's actual archive.
      - name: Verify core flows and full regression suite
        run: |
          npm run smoke:happy
          npm run smoke:durable
          npm test
          npm run verify:installer-staged

      - name: Upload verified installable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulso-v4-${{ steps.metadata.outputs.version }}-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            v4/artifacts/pulso-opencode-${{ steps.metadata.outputs.version }}.tar.gz
            v4/artifacts/pulso-opencode-${{ steps.metadata.outputs.version }}.tar.gz.sha256
            v4/artifacts/pulso-${{ steps.metadata.outputs.version }}.vsix
            v4/artifacts/pulso-${{ steps.metadata.outputs.version }}.vsix.sha256
            v4/artifacts/pulso-opencode-installer-${{ steps.metadata.outputs.version }}.tar.gz
            v4/artifacts/pulso-opencode-installer-${{ steps.metadata.outputs.version }}.tar.gz.sha256
